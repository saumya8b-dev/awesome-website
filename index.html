<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FairyAdu.com</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Georgia,serif;
overflow:hidden;
height:100vh;
background:linear-gradient(135deg,#f573a5,#fc8be3,#d08eff);
display:flex;
justify-content:center;
align-items:center;
}

.card {
  width: min(90%,700px);
  padding: 30px;
  border-radius: 35px;
  background: rgba(255,255,255,.25);
  backdrop-filter: blur(15px);
  text-align: center;
  box-shadow: 0 0 30px rgba(255,255,255,.5);
  /* ADD THESE TWO LINES BELOW */
  position: relative;
  z-index: 20; 
}

h1{
font-size:3rem;
color:white;
text-shadow:0 0 15px white;
}

p,h2{
color:white;
}

.photo{
width:250px;
height:250px;
border-radius:25px;
object-fit:cover;
border:6px solid white;
margin:15px 0;
}

.star{
font-size:45px;
cursor:pointer;
color:white;
transition:.3s;
}

.active{
color:gold;
}

.float{
position:absolute;
font-size:30px;
animation:fly linear infinite;
opacity:.8;
}

@keyframes fly{
0%{
transform:translateY(110vh);
}
100%{
transform:translateY(-150px);
}
}
</style>
</head>

<body>

<div class="card">

<h1>FairyAdu.com</h1>

<p>Welcome to Adu's Fairy Kingdom</p>

<img src="your_photo.jpeg" class="photo">

<div>
<span class="star" data-value="1">★</span>
<span class="star" data-value="2">★</span>
<span class="star" data-value="3">★</span>
<span class="star" data-value="4">★</span>
<span class="star" data-value="5">★</span>
</div>

<h2 id="avg">Average Rating: Loading...</h2>

<p>Votes: <span id="votes">0</span></p>

</div>

<script type="module">

// Floating elements code stays intact
const items=["🦋","🌸","✨","🦄","🎈","💖"];

for(let i=0;i<50;i++){
  let el=document.createElement("div");
  el.className="float";
  el.innerHTML=items[Math.floor(Math.random()*items.length)];
  el.style.left=Math.random()*100+"vw";
  el.style.animationDuration=(6+Math.random()*10)+"s";
  document.body.appendChild(el);
}

// 1. Firebase CDN Imports for direct web execution
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

// 2. Your Verified Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCFIVoKOIiJW4pCBrqXWgsCK2spwuoGXYM",
  authDomain: "awesome-project-fairy.firebaseapp.com",
  projectId: "awesome-project-fairy",
  storageBucket: "awesome-project-fairy.firebasestorage.app",
  messagingSenderId: "629900355479",
  appId: "1:629900355479:web:65baaed4b484fdbc6086d2"
};

// 3. Initialize connection
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const stars = document.querySelectorAll('.star');

// 4. Load calculations globally from the cloud right when page loads
async function loadGlobalRatings() {
  try {
    const querySnapshot = await getDocs(collection(db, "ratings"));
    let totalVotes = 0;
    let sumOfRatings = 0;

    querySnapshot.forEach((doc) => {
      const data = doc.data();
      if(data.starsSelected) {
        sumOfRatings += data.starsSelected;
        totalVotes++;
      }
    });

    const average = totalVotes > 0 ? (sumOfRatings / totalVotes).toFixed(1) : "0.0";
    
    document.getElementById("avg").innerText = "Average Rating: " + average;
    document.getElementById("votes").innerText = totalVotes;
  } catch (error) {
    console.error("Error loading ratings from Firebase: ", error);
    document.getElementById("avg").innerText = "Average Rating: 0.0";
  }
}

// Run loader on startup
loadGlobalRatings();

// 5. Dynamic Click Listeners attached cleanly in JS
stars.forEach(star => {
  star.addEventListener('click', async () => {
    const ratingValue = parseInt(star.getAttribute('data-value'));
    
    // Instantly highlight the active stars locally
    updateStarUI(ratingValue);
    
    // Save to Firestore, then refresh calculations
    await saveRatingToCloud(ratingValue);
  });
});

function updateStarUI(rating) {
  stars.forEach((star, index) => {
    star.classList.toggle("active", index < rating);
  });
}

// 6. Push data globally function
async function saveRatingToCloud(rating) {
  try {
    await addDoc(collection(db, "ratings"), {
      starsSelected: rating,
      timestamp: new Date()
    });
    console.log("Saved globally!");
    // Refresh calculations instantly on screen
    loadGlobalRatings();
  } catch (error) {
    console.error("Error saving data: ", error);
  }
}

</script>

</body>
</html>
