<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FairyAdu.com</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Define default variables at the root (Default is your original pink/purple gradient) */
:root {
  --bg-gradient: linear-gradient(135deg, #f573a5, #fc8be3, #d08eff);
  --btn-color: #f573a5;
}

/* Purple Theme Definition */
[data-theme="purple"] {
  --bg-gradient: linear-gradient(135deg, #a78bfa, #c084fc, #818cf8);
  --btn-color: #7c3aed;
}

/* Blue Theme Definition */
[data-theme="blue"] {
  --bg-gradient: linear-gradient(135deg, #7dd3fc, #38bdf8, #a5b4fc);
  --btn-color: #0284c7;
}

/* Pink Theme Definition */
[data-theme="pink"] {
  --bg-gradient: linear-gradient(135deg, #f573a5, #fc8be3, #d08eff);
  --btn-color: #f573a5;
}

body {
  font-family: Georgia, serif;
  overflow: hidden;
  height: 100vh;
  background: var(--bg-gradient);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  transition: background 0.5s ease;
}

/* Navigation area to hold the top buttons safely */
.top-nav {
  text-align: center;
  margin-top: 25px;
  margin-bottom: 0px;
  z-index: 30;
}

/* Theme Panel Layout inside top navigation */
.theme-selector {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 15px;
}

/* Little circular clickable theme dots */
.theme-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid white;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transition: transform 0.2s;
}

.theme-dot:hover {
  transform: scale(1.2);
}

.pink-dot { background: #fc8be3; }
.purple-dot { background: #c084fc; }
.blue-dot { background: #38bdf8; }

/* Smooth layout container handling alignment and shifts */
.app-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  width: min(95%, 1200px);
  height: calc(100vh - 120px);
  margin: 0 auto;
  position: relative;
}

.card {
  width: min(90%, 500px);
  padding: 30px;
  border-radius: 35px;
  background: rgba(255, 255, 255, .25);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  text-align: center;
  box-shadow: 0 0 30px rgba(255, 255, 255, .5);
  position: relative;
  z-index: 20; 
  flex-shrink: 0;
  transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}

h1 {
  font-size: 3rem;
  color: white;
  text-shadow: 0 0 15px white;
}

p, h2 {
  color: white;
}

.photo {
  width: 220px;
  height: 220px;
