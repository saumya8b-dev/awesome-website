<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FairyAdu.com</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Georgia,serif;
overflow:hidden;
height:100vh;
background:linear-gradient(135deg,#f573a5,#fc8be3,#d08eff);
display:flex;
justify-content:center;
align-items:center;
}

.card {
  width: min(90%,700px);
  padding: 30px;
  border-radius: 35px;
  background: rgba(255,255,255,.25);
  backdrop-filter: blur(15px);
  text-align: center;
  box-shadow: 0 0 30px rgba(255,255,255,.5);
  /* ADD THESE TWO LINES BELOW */
  position: relative;
  z-index: 20; 
}

h1{
font-size:3rem;
color:white;
text-shadow:0 0 15px white;
}

p,h2{
color:white;
}

.photo{
width:250px;
height:250px;
border-radius:25px;
object-fit:cover;
border:6px solid white;
margin:15px 0;
}

.star{
font-size:45px;
cursor:pointer;
color:white;
transition:.3s;
}

.active{
color:gold;
}

.float{
position:absolute;
font-size:30px;
animation:fly linear infinite;
opacity:.8;
}

@keyframes fly{
0%{
transform:translateY(110vh);
}
100%{
transform:translateY(-150px);
}
}
/* Container styling */
#comments-section {
  margin-top: 20px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background-color: #fff;
  max-width: 500px;
}

/* Class to handle the collapsing functionality */
.comments-hidden {
  display: none !important;
}

/* Individual comment layout */
.comment-card {
  padding: 10px;
  border-bottom: 1px solid #eee;
  margin-bottom: 10px;
}

/* Reaction buttons styling */
.reaction-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  margin-right: 10px;
  padding: 2px 5px;
  transition: transform 0.1s;
}

.reaction-btn:active {
  transform: scale(1.2);
}
</style>
</head>

<body>

<div class="card">

<h1>FairyAdu.com</h1>

<p>Welcome to Adu's Fairy Kingdom</p>

<img src="your_photo.jpeg" class="photo">

<div>
<span class="star" data-value="1">★</span>
<span class="star" data-value="2">★</span>
<span class="star" data-value="3">★</span>
<span class="star" data-value="4">★</span>
<span class="star" data-value="5">★</span>
</div>

<h2 id="avg">Average Rating: Loading...</h2>

<p>Votes: <span id="votes">0</span></p>

</div>
<button id="toggle-comments-btn">💬 Show Comments</button>

<div id="comments-section" class="comments-hidden">
  <h3>Community Thoughts</h3>
  
  <div id="comment-form">
    <input type="text" id="comment-input" placeholder="Write a public comment..." maxlength="250">
    <button id="submit-comment-btn">Post</button>
  </div>

  <div id="comments-list"></div>
</div>
<script type="module">
  // 1. Floating elements code (Butterfly/Flower emoji generation)
  const items = ["🦋", "🌸", "✨", "🦄", "🎈", "💖"];

  for (let i = 0; i < 50; i++) {
    let el = document.createElement("div");
    el.className = "float";
    el.innerHTML = items[Math.floor(Math.random() * items.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (6 + Math.random() * 10) + "s";
    document.body.appendChild(el);
  }

  // 2. Import BOTH Firebase App and Firestore Database from the CDN links
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

  // 3. Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCFIVoKOIiJW4pCBrqXWgsCK2spwuoGXYM",
    authDomain: "awesome-project-fairy.firebaseapp.com",
    projectId: "awesome-project-fairy",
    storageBucket: "awesome-project-fairy.firebasestorage.app",
    messagingSenderId: "629900355479",
    appId: "1:629900355479:web:65baaed4b484fdbc6086d2"
  };

  // 4. Initialize Firebase and link the Firestore Database
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const stars = document.querySelectorAll('.star');

  // 5. Function to load calculations globally from the cloud on startup
  async function loadGlobalRatings() {
    try {
      const querySnapshot = await getDocs(collection(db, "ratings"));
      let totalVotes = 0;
      let sumOfRatings = 0;

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        if (data.starsSelected) {
          sumOfRatings += data.starsSelected;
          totalVotes++;
        }
      });

      const average = totalVotes > 0 ? (sumOfRatings / totalVotes).toFixed(1) : "0.0";
      
      document.getElementById("avg").innerText = "Average Rating: " + average;
      document.getElementById("votes").innerText = totalVotes;
    } catch (error) {
      console.error("Error loading ratings from Firebase: ", error);
      document.getElementById("avg").innerText = "Average Rating: 0.0";
    }
  }

  // Run database fetch instantly when the page opens
  loadGlobalRatings();

  // 6. Dynamic Star Click Listeners
  stars.forEach(star => {
    star.addEventListener('click', async () => {
      const ratingValue = parseInt(star.getAttribute('data-value'));
      
      // Update UI color colors instantly local
      updateStarUI(ratingValue);
      
      // Send the score to the cloud, then pull fresh calculations
      await saveRatingToCloud(ratingValue);
    });
  });

  function updateStarUI(rating) {
    stars.forEach((star, index) => {
      star.classList.toggle("active", index < rating);
    });
  }

  // 7. Push data globally function
  async function saveRatingToCloud(rating) {
    try {
      await addDoc(collection(db, "ratings"), {
        starsSelected: rating,
        timestamp: new Date()
      });
      console.log("Saved globally!");
      
      // Refresh the screen calculation metrics
      loadGlobalRatings();
    } catch (error) {
      console.error("Error saving data: ", error);
    }
  }
</script>

</body>
</html>
